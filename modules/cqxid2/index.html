<script>
  (() => {
    const P = "modulex-acilis-panel-serit";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const panelSerit = (s, P) => {
        const pn = [...s.querySelectorAll("[data-panel]")];
        if (pn.length < 2) return;
        s.classList.add(P + "--pjs");
        const ac = (h) => pn.forEach((x) => {
          const on = x === h;
          x.classList.toggle(P + "-panel--acik", on);
          const b = x.querySelector("button[aria-expanded]");
          if (b) b.setAttribute("aria-expanded", String(on));
        });
        pn.forEach((x) => {
          const b = x.querySelector("button[aria-expanded]");
          if (b) b.addEventListener("click", () => ac(x));
        });
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      panelSerit(s, P, az);
    });
  })();
</script>
